<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qué mueve el precio de Bitcoin</title>
<meta name="description" content="Puntaje de cuánto aporta cada variable al movimiento del precio de Bitcoin, medido fuera de muestra contra un piso de ruido.">
<style>
:root{
  --bg:#0b0f14; --card:#111823; --line:#1c2632; --grid:#232e3c;
  --text:#e6edf3; --dim:#8b949e; --mut:#5c6773;
  --up:#26d07c; --down:#ff5d6c; --acc:#5fa8ff; --oro:#d6a84f; --ruido:#4a5563;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:13px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 0 40px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
a{color:var(--acc)}

header{border-bottom:1px solid var(--line);padding:14px 0 12px;margin-bottom:16px}
.fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
h1 span{color:var(--mut);font-weight:500}
nav{display:flex;gap:14px;font-size:11px}
nav a{color:var(--dim);text-decoration:none} nav a:hover{color:var(--acc)}
.est{margin-left:auto;font-size:10.5px;color:var(--mut);display:flex;align-items:center;gap:8px}
button{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:6px;
  padding:6px 12px;font:inherit;font-size:11.5px;cursor:pointer}
button:hover{border-color:var(--acc);color:var(--text)}
button:disabled{opacity:.5;cursor:not-allowed}

.tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.tabs button.on{border-color:var(--acc);background:#152232;color:var(--text);font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:14px;min-width:0;overflow:hidden}
.card h2{margin:0 0 3px;font-size:12px;font-weight:700;letter-spacing:.05em}
.sub{margin:0 0 12px;font-size:10.5px;color:var(--mut);line-height:1.5}

/* veredicto */
.ver{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ver .gr{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ver .tx{font-size:11.5px;color:var(--dim);max-width:560px;line-height:1.55}
.ver .tx b{color:var(--text)}

/* familias */
.fam{display:grid;grid-template-columns:1fr;gap:7px}
.frow{display:grid;grid-template-columns:168px 1fr 92px;gap:10px;align-items:center}
.frow .n{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:15px;background:#0d131a;border-radius:4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:4px}
.frow .c{font-size:10.5px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}

/* tabla de variables */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.debil td{opacity:.45}
.pos{color:var(--mut);font-variant-numeric:tabular-nums;width:26px;text-align:right}
.nom{font-weight:600;white-space:nowrap}
.fa{font-size:10px;color:var(--mut);white-space:nowrap}
.mult{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;text-align:right}
.tblwrap{overflow-x:auto}

/* acelerómetro: dónde está la variable hoy */
.acel{position:relative;height:16px;min-width:104px;background:linear-gradient(90deg,
  rgba(95,168,255,.13) 0%, rgba(95,168,255,.05) 50%, rgba(214,168,79,.16) 100%);
  border-radius:8px;border:1px solid var(--grid)}
.acel i{position:absolute;top:-2px;width:3px;height:18px;border-radius:2px;background:var(--text);
  box-shadow:0 0 5px rgba(0,0,0,.7)}
.acel b{position:absolute;top:0;left:50%;width:1px;height:100%;background:var(--grid)}
.acelT{font-size:9.5px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}

.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:9.5px;font-weight:700}
.pill.si{background:rgba(38,208,124,.15);color:var(--up)}
.pill.no{background:rgba(139,148,158,.12);color:var(--mut)}

.nota{color:var(--mut);font-size:10.5px;line-height:1.6;margin-top:10px}
.err{background:rgba(255,93,108,.08);border:1px solid rgba(255,93,108,.25);border-radius:8px;
  padding:11px 14px;font-size:11.5px;color:#ff8791;margin-bottom:12px}
code{background:#0b0f14;border:1px solid var(--line);border-radius:4px;padding:1px 5px;
  font-size:10.5px;color:var(--dim)}
@media (max-width:720px){
  .frow{grid-template-columns:120px 1fr 74px}
  .ocultar-chico{display:none}
  /* En pantalla angosta la barra de aporte se va: el múltiplo "vs. ruido" ya
     dice lo mismo en número, y así el acelerómetro —que es el punto de esta
     tabla— entra sin tener que arrastrar de lado. */
  .colBar{display:none}
  td,th{padding:6px 5px}
  .acel{min-width:76px}
}
</style></head>

<script>
const $ = id => document.getElementById(id);
let D = null, OBJ = null;
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = (v, d=2) => v == null || !isFinite(v) ? "—"
  : v.toLocaleString("es-MX", {minimumFractionDigits:d, maximumFractionDigits:d});

// La misma página sirve en dos modos. Con servidor (Ballena) pide el puntaje
// a /api/aporte. Publicada como sitio estático no hay servidor que preguntar,
// así que el generador incrusta los datos en window.__APORTE__ y se leen de
// ahí. Un solo archivo para los dos, para que no se desincronicen.
const ESTATICO = typeof window.__APORTE__ !== "undefined";

async function carga(){
  let j;
  if(ESTATICO){
    j = window.__APORTE__;
  } else {
    try{ j = await (await fetch("/api/aporte")).json(); }
    catch(e){ $("errBox").innerHTML = `<div class="err">Sin conexión: ${esc(e)}</div>`; return; }
  }
  if(!j.ok){
    $("errBox").innerHTML = `<div class="err"><b>Todavía no hay medición.</b> ` +
      `${esc(j.err || "")} — córrela con <code>${esc(j.como || "python ML/aporte.py")}</code></div>`;
    return;
  }
  $("errBox").innerHTML = j.ultimo_error
    ? `<div class="err">La última recalculación falló: ${esc(j.ultimo_error)}</div>` : "";
  D = j;
  $("gen").textContent = `${j.dias.toLocaleString("es-MX")} días · ` +
    `${j.desde} → ${j.hasta} · medido ${(j.generado||"").slice(0,10)}`;
  if(ESTATICO){
    // Sin servidor no hay nada que recalcular: se publica una foto.
    $("btnRe").style.display = "none";
  } else {
    $("btnRe").disabled = !!j.calculando;
    $("btnRe").textContent = j.calculando ? "calculando…" : "Recalcular";
    if(j.calculando) setTimeout(carga, 5000);
  }

  const claves = Object.keys(j.objetivos);
  if(!claves.includes(OBJ)) OBJ = claves[0];
  $("tabs").innerHTML = claves.map(k =>
    `<button data-k="${k}" class="${k===OBJ?"on":""}">${esc(j.objetivos[k].titulo)}</button>`
  ).join("");
  [...$("tabs").children].forEach(b => b.onclick = () => {
    OBJ = b.dataset.k;
    [...$("tabs").children].forEach(x => x.classList.toggle("on", x===b));
    pinta();
  });
  pinta();
}

function pinta(){
  const o = D.objetivos[OBJ];
  const esDir = OBJ === "direccion";
  $("tVer").textContent = o.titulo.toUpperCase();
  $("sVer").textContent = o.explica;

  // El marcador grande: qué tan bien se adivina, antes de hablar de variables.
  const val = esDir ? o.base : Math.abs(o.base);
  $("grande").textContent = esDir ? nf(val, 3) : nf(val, 2) + " %";
  $("grande").style.color = esDir
    ? (val > 0.55 ? "var(--up)" : val > 0.52 ? "var(--oro)" : "var(--down)")
    : "var(--acc)";
  $("grandeEt").textContent = esDir ? "AUC · 0.500 = volado"
                                    : "error típico al adivinar el recorrido del día";
  $("veredicto").innerHTML = esDir
    ? `Con las 100 variables juntas, adivinar si mañana sube o baja da <b>${nf(o.base,3)}</b>,
       y lanzar una moneda da 0.500. <b>${o.cuantas_superan} de ${o.variables.length}</b>
       variables superan el ruido. La dirección del precio casi no se puede anticipar, y
       este tabulador lo dice en vez de esconderlo: si abajo ves barras, son barras chicas.`
    : `El recorrido del día se falla por <b>${nf(Math.abs(o.base),2)} %</b> en promedio, y
       <b>${o.cuantas_superan} de ${o.variables.length}</b> variables superan el ruido.
       Aquí sí hay estructura: el mercado no dice hacia dónde va, pero sí avisa
       cuándo se va a mover fuerte.`;

  // Familias
  const fmax = Math.max(...o.familias.map(f => f.aporte), 1e-9);
  $("familias").innerHTML = o.familias.map(f => `
    <div class="frow">
      <div class="n">${esc(f.familia)}</div>
      <div class="bar"><i style="width:${(f.aporte/fmax*100).toFixed(1)}%;
        background:${f.superan ? "var(--acc)" : "var(--ruido)"}"></i></div>
      <div class="c">${f.superan}/${f.n} sobre ruido</div>
    </div>`).join("");

  // Variables, de más a menos
  const vs = o.variables.slice(0, 40);
  const vmax = Math.max(...vs.map(v => v.aporte), 1e-9);
  $("subVars").innerHTML =
    `Ordenadas de mayor a menor aporte. El <b>acelerómetro</b> de la derecha no mide aporte:
     mide dónde está esa variable <b>hoy</b> contra sus últimos dos años, de su mínimo
     (izquierda) a su máximo (derecha). Las filas apagadas no superan el piso de ruido
     (${nf(o.piso,5)}), o sea que no se distinguen de un dado.`;
  $("tabla").innerHTML =
    `<thead><tr><th></th><th>Variable</th><th class="ocultar-chico">Familia</th>
      <th class="colBar">Aporte</th><th style="text-align:right">vs. ruido</th>
      <th>Hoy</th><th style="text-align:right">Percentil</th></tr></thead><tbody>` +
    vs.map((v, i) => {
      const p = v.percentil_hoy;
      return `<tr class="${v.supera ? "" : "debil"}">
        <td class="pos">${i+1}</td>
        <td><span class="nom">${esc(v.variable)}</span></td>
        <td class="fa ocultar-chico">${esc(v.familia)}</td>
        <td class="colBar" style="min-width:110px"><div class="bar"><i style="width:${
            (Math.max(v.aporte,0)/vmax*100).toFixed(1)}%;background:${
            v.supera ? "var(--up)" : "var(--ruido)"}"></i></div></td>
        <td class="mult" style="color:${v.supera ? "var(--up)" : "var(--mut)"}">${
            v.sobre_piso == null ? "—" : v.sobre_piso + "×"}</td>
        <td><div class="acel"><b></b>${p == null ? "" :
            `<i style="left:calc(${Math.max(0,Math.min(100,p))}% - 1.5px)"></i>`}</div></td>
        <td class="acelT" style="text-align:right">${p == null ? "—" : nf(p,0)}</td>
      </tr>`;
    }).join("") + `</tbody>`;

  $("metodo").innerHTML =
    `<b>Cómo se mide.</b> ${esc(D.metodo.validacion)}. Para cada variable: ${esc(D.metodo.importancia)}
     — se baraja su columna en el tramo de prueba y se mira cuánto empeora la predicción.
     Lo que no se pierde al destruirla, no aportaba. ${esc(D.metodo.piso)}.
     Esto no es la "importancia" que reportan los modelos de árboles: esa se calcula
     con los mismos datos del entrenamiento y en series financieras infla el ruido.`;
}

$("btnRe").addEventListener("click", async () => {
  $("btnRe").disabled = true; $("btnRe").textContent = "calculando…";
  try{ await fetch("/api/aporte/recalcular", {method:"POST"}); }catch(_){}
  setTimeout(carga, 3000);
});

carga();
</script>
</body></html>
